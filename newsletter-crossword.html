<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Mini Crossword</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            background-color: #FFFFFF;
            color: #1B1B1B;
            line-height: 1.4;
        }

        .crossword-container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        .crossword-title {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 24px;
            color: #1B1B1B;
            margin-bottom: 5px;
            line-height: 1.1;
        }

        .puzzle-subtitle {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .crossword-grid {
            display: inline-grid;
            grid-template-columns: repeat(5, 40px);
            grid-template-rows: repeat(5, 40px);
            gap: 1px;
            background-color: #1B1B1B;
            border: 2px solid #1B1B1B;
            margin: 20px auto;
        }

        .grid-cell {
            position: relative;
            background-color: #FFFFFF;
        }

        .grid-cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            color: #1B1B1B;
            background: transparent;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .grid-cell input:focus {
            outline: 2px solid #1B1B1B;
            background-color: #f8f8f8;
        }

        .cell-number {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 10px;
            font-weight: bold;
            color: #1B1B1B;
            pointer-events: none;
            font-family: 'Courier New', monospace;
        }

        .black-cell {
            background-color: #1B1B1B;
        }

        .highlight-word {
            background-color: #f0f0f0;
        }

        .highlight-active {
            background-color: #e0e0e0;
        }

        .clues-container {
            display: flex;
            justify-content: space-between;
            gap: 30px;
            margin-top: 20px;
            text-align: left;
        }

        .clues-section {
            flex: 1;
        }

        .clues-section h3 {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 16px;
            color: #1B1B1B;
            margin: 0 0 10px 0;
            border-bottom: 1px solid #1B1B1B;
            padding-bottom: 5px;
        }

        .clue-item {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 6px;
            color: #1B1B1B;
        }

        .clue-item b {
            font-weight: bold;
        }

        .puzzle-controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .puzzle-controls button {
            font-family: 'Courier New', monospace;
            padding: 8px 16px;
            font-size: 12px;
            border: 1px solid #1B1B1B;
            background: #FFFFFF;
            color: #1B1B1B;
            cursor: pointer;
            font-weight: bold;
        }

        .puzzle-controls button:hover {
            background: #f0f0f0;
        }

        .puzzle-controls button:disabled {
            background: #f8f8f8;
            color: #999;
            cursor: not-allowed;
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .clues-container {
                flex-direction: column;
                gap: 20px;
            }

            .crossword-grid {
                grid-template-columns: repeat(5, 35px);
                grid-template-rows: repeat(5, 35px);
            }

            .grid-cell input {
                font-size: 16px;
            }
        }

        /* Sticky clue bar for mobile */
        #sticky-clue-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #FFFFFF;
            border-bottom: 1px solid #1B1B1B;
            padding: 12px 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            text-align: center;
            z-index: 1000;
            display: none;
        }

        #sticky-clue-bar .clue-number {
            font-weight: bold;
            color: #1B1B1B;
            margin-right: 8px;
        }

        #sticky-clue-bar .clue-text {
            color: #1B1B1B;
        }

        @media (max-width: 768px) {
            #sticky-clue-bar {
                display: block;
            }

            body {
                padding-top: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="crossword-container">
        <div class="crossword-title">Music Mini</div>
        <div class="puzzle-subtitle" id="puzzleTitle">Loading...</div>

        <div id="sticky-clue-bar">
            <span class="clue-number"></span>
            <span class="clue-text">Select a square to start</span>
        </div>

        <div class="crossword-grid" id="crosswordGrid">
            <!-- Grid will be generated by JavaScript -->
        </div>

        <div class="clues-container">
            <div class="clues-section">
                <h3>Across</h3>
                <div id="cluesAcross"></div>
            </div>
            <div class="clues-section">
                <h3>Down</h3>
                <div id="cluesDown"></div>
            </div>
        </div>

        <div class="puzzle-controls">
            <button id="prevPuzzle">← Previous</button>
            <button id="nextPuzzle">Next →</button>
        </div>
    </div>

    <script>
        // Newsletter crossword implementation using your established puzzle system
        class NewsletterCrossword {
            constructor() {
                // Use your established puzzle file system
                this.puzzleIds = [
                    'world-premiere-2025-09-26',
                    'cycling-playlist-2025-07-19',
                    'classic-hiphop-2025-07-17'
                ];

                this.currentPuzzleIndex = 0;
                this.currentPuzzleData = null;
                this.direction = 'across';
                this.activeCell = null;

                this.init();
            }

            async init() {
                try {
                    // Load the first puzzle by default, or get from URL parameter
                    const urlParams = new URLSearchParams(window.location.search);
                    const puzzleId = urlParams.get('puzzle') || this.puzzleIds[0];

                    await this.loadPuzzleById(puzzleId);
                    this.setupEvents();
                } catch (error) {
                    console.error("Failed to load puzzle:", error);
                    this.showError("Could not load puzzle. Please check that the puzzle file exists.");
                }
            }

            async loadPuzzleById(puzzleId) {
                if (!puzzleId) {
                    throw new Error("No puzzle ID provided");
                }

                // Load from your established puzzles folder structure
                const response = await fetch(`/puzzles/${puzzleId}.json`);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status} for puzzle ${puzzleId}`);
                }

                this.currentPuzzleData = await response.json();
                this.renderPuzzle();
            }

            renderPuzzle() {
                if (!this.currentPuzzleData) return;

                this.generateGrid();
                this.updateClues();
            }

            showError(message) {
                document.getElementById('puzzleTitle').textContent = "Error";
                document.getElementById('cluesAcross').innerHTML = `<div style="color: #999; font-style: italic;">${message}</div>`;
                document.getElementById('cluesDown').innerHTML = "";
            }

            generateGrid() {
                const grid = document.getElementById('crosswordGrid');
                const puzzle = this.currentPuzzleData;

                if (!puzzle) return;

                grid.innerHTML = '';

                // Use dynamic grid sizing from your puzzle data
                const gridSize = puzzle.gridSize;
                grid.style.gridTemplateColumns = `repeat(${gridSize.cols}, 40px)`;
                grid.style.gridTemplateRows = `repeat(${gridSize.rows}, 40px)`;

                // Use your established grid generation logic
                const gridData = Array(gridSize.rows).fill(null).map(() => 
                    Array(gridSize.cols).fill(null)
                );

                // Fill grid with word data using your format
                puzzle.words.forEach(wordInfo => {
                    let r = wordInfo.row, c = wordInfo.col;
                    for (let i = 0; i < wordInfo.word.length; i++) {
                        if (!gridData[r][c]) {
                            gridData[r][c] = { answer: '', across: null, down: null };
                        }
                        gridData[r][c].answer = wordInfo.word[i];
                        gridData[r][c][wordInfo.direction] = wordInfo.number;
                        if (i === 0) {
                            gridData[r][c].number = wordInfo.number;
                        }
                        if (wordInfo.direction === 'across') c++;
                        else r++;
                    }
                });

                // Create DOM elements
                for (let r = 0; r < gridSize.rows; r++) {
                    for (let c = 0; c < gridSize.cols; c++) {
                        const cellData = gridData[r][c];
                        if (!cellData) {
                            const blackCell = document.createElement('div');
                            blackCell.className = 'black-cell';
                            grid.appendChild(blackCell);
                        } else {
                            const cellWrapper = document.createElement('div');
                            cellWrapper.className = 'grid-cell';

                            const input = document.createElement('input');
                            input.type = 'text';
                            input.maxLength = 1;
                            input.dataset.row = r;
                            input.dataset.col = c;
                            input.dataset.answer = cellData.answer;

                            if (cellData.across) input.dataset.across = cellData.across;
                            if (cellData.down) input.dataset.down = cellData.down;

                            cellWrapper.appendChild(input);

                            if (cellData.number) {
                                const numberSpan = document.createElement('span');
                                numberSpan.className = 'cell-number';
                                numberSpan.textContent = cellData.number;
                                cellWrapper.appendChild(numberSpan);
                            }

                            grid.appendChild(cellWrapper);
                        }
                    }
                }

                // Update title from puzzle data
                document.getElementById('puzzleTitle').textContent = puzzle.title || 'Music Mini Crossword';
            }

            updateClues() {
                if (!this.currentPuzzleData) return;

                const puzzle = this.currentPuzzleData;
                const acrossDiv = document.getElementById('cluesAcross');
                const downDiv = document.getElementById('cluesDown');

                acrossDiv.innerHTML = '';
                downDiv.innerHTML = '';

                // Use your actual clue data
                if (puzzle.clues && puzzle.clues.across) {
                    puzzle.clues.across.forEach(clue => {
                        const div = document.createElement('div');
                        div.className = 'clue-item';
                        div.innerHTML = `<b>${clue.number}.</b> ${clue.text}`;
                        acrossDiv.appendChild(div);
                    });
                }

                if (puzzle.clues && puzzle.clues.down) {
                    puzzle.clues.down.forEach(clue => {
                        const div = document.createElement('div');
                        div.className = 'clue-item';
                        div.innerHTML = `<b>${clue.number}.</b> ${clue.text}`;
                        downDiv.appendChild(div);
                    });
                }
            }

            setupEvents() {
                const grid = document.getElementById('crosswordGrid');
                grid.addEventListener('click', (e) => this.handleCellClick(e));
                grid.addEventListener('input', (e) => this.handleInput(e));
                grid.addEventListener('keydown', (e) => this.handleKeydown(e));
            }

            handleCellClick(e) {
                if (e.target.tagName !== 'INPUT') return;

                const input = e.target;

                if (input === this.activeCell && input.dataset.across && input.dataset.down) {
                    this.direction = this.direction === 'across' ? 'down' : 'across';
                } else if (!input.dataset[this.direction]) {
                    this.direction = input.dataset.across ? 'across' : 'down';
                }

                this.activeCell = input;
                this.highlightWord();
            }

            handleInput(e) {
                if (e.target.tagName !== 'INPUT') return;

                const input = e.target;
                input.value = input.value.toUpperCase();

                if (input.value) {
                    this.moveToNextCell(input);
                }

                this.checkCompletion();
            }

            handleKeydown(e) {
                if (!this.activeCell) return;

                if (e.key === 'Backspace' && !this.activeCell.value) {
                    e.preventDefault();
                    this.moveToPrevCell(this.activeCell);
                }
            }

            moveToNextCell(cell) {
                const clueNum = cell.dataset[this.direction];
                const cells = document.querySelectorAll(`input[data-${this.direction}='${clueNum}']`);
                const currentIndex = Array.from(cells).indexOf(cell);

                if (currentIndex < cells.length - 1) {
                    const nextCell = cells[currentIndex + 1];
                    nextCell.focus();
                    this.activeCell = nextCell;
                    this.highlightWord();
                }
            }

            moveToPrevCell(cell) {
                const clueNum = cell.dataset[this.direction];
                const cells = document.querySelectorAll(`input[data-${this.direction}='${clueNum}']`);
                const currentIndex = Array.from(cells).indexOf(cell);

                if (currentIndex > 0) {
                    const prevCell = cells[currentIndex - 1];
                    prevCell.focus();
                    this.activeCell = prevCell;
                    this.highlightWord();
                }
            }

            highlightWord() {
                document.querySelectorAll('.grid-cell').forEach(c => 
                    c.classList.remove('highlight-word', 'highlight-active')
                );

                if (!this.activeCell) return;

                const clueNum = this.activeCell.dataset[this.direction];
                if (!clueNum) return;

                document.querySelectorAll(`input[data-${this.direction}='${clueNum}']`).forEach(cell => {
                    cell.parentElement.classList.add('highlight-word');
                });

                this.activeCell.parentElement.classList.add('highlight-active');
                this.updateStickyClue(clueNum);
            }

            updateStickyClue(clueNum) {
                if (!this.currentPuzzleData) return;

                const puzzle = this.currentPuzzleData;
                const clueData = puzzle.clues[this.direction].find(c => c.number == clueNum);
                const clueBar = document.getElementById('sticky-clue-bar');

                if (clueData) {
                    clueBar.querySelector('.clue-number').textContent = `${clueData.number}.`;
                    clueBar.querySelector('.clue-text').textContent = clueData.text;
                }
            }

            checkCompletion() {
                const inputs = document.querySelectorAll('.grid-cell input');
                for (const input of inputs) {
                    if (input.value.toUpperCase() !== input.dataset.answer) return;
                }

                setTimeout(() => {
                    alert('Congratulations! You completed the puzzle!');
                }, 100);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new NewsletterCrossword();
        });
    </script>
</body>
</html>
