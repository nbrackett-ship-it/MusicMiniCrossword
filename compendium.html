<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stems // The 2025 Crossword Compendium</title>
    <style>
        /* STEMS CONTEMPORARY TECH-BRUTALIST SYSTEM */
        :root {
            --bg: #fdfdfd;
            --text: #000000;
            --white: #ffffff;
            --gray: #f0f0f0;
            --border-width: 2px;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            line-height: 1.6;
        }

        .container {
            max-width: 650px;
            width: 100%;
            padding: 80px 24px;
        }

        /* HEADER */
        header {
            text-align: left;
            border-left: 8px solid var(--text);
            padding-left: 24px;
            margin-bottom: 60px;
        }

        .slug {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 8px;
            color: #666;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin: 0;
            line-height: 1;
        }

        /* THE VAULT GRID */
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 40px 0;
        }

        .puzzle-card {
            border: var(--border-width) solid var(--text);
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            color: var(--text);
            background: var(--white);
            transition: all 0.15s ease-in-out;
            position: relative;
        }

        .puzzle-card:hover {
            background: var(--text);
            color: var(--white);
            transform: translate(-4px, -4px);
            box-shadow: 6px 6px 0px var(--gray);
        }

        /* INCREASED FONT SIZE FOR LEGIBILITY */
        .puzzle-title {
            font-size: 15px; 
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.2;
        }

        /* EXCLUSIVE BADGE */
        .exclusive {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--text);
            color: var(--white);
            font-size: 8px;
            padding: 2px 5px;
            font-weight: 900;
        }

        /* REFERRAL WIDGET */
        .share-widget {
            background: var(--gray);
            border: var(--border-width) solid var(--text);
            padding: 40px;
            margin-top: 80px;
        }

        .widget-header {
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .widget-copy {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .link-container {
            display: flex;
            gap: 10px;
            background: var(--white);
            border: 1px solid var(--text);
            padding: 6px;
        }

        input[type="text"] {
            flex: 1;
            border: none;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            background: transparent;
        }

        .btn-copy {
            background: var(--text);
            color: var(--white);
            border: none;
            padding: 0 25px;
            text-transform: uppercase;
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
        }

        footer {
            margin-top: 80px;
            font-size: 10px;
            text-transform: uppercase;
            opacity: 0.5;
            letter-spacing: 1px;
            text-align: center;
        }

        @media (max-width: 550px) {
            .vault-grid { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 24px; }
            .puzzle-title { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <span class="slug">Access Granted</span>
            <h1>The Stems Crossword Compendium</h1>
        </header>

        <div id="vaultGrid" class="vault-grid">
            </div>

        <section class="share-widget">
            <div class="widget-header">Keep Sharing the Signal</div>
            <p class="widget-copy">Enjoying the Compendium? Help us find more music heavyweights by sharing Stems with your network.</p>
            <div class="link-container">
                <input type="text" value="https://stems.media/subscribe?ref=YOUR_ID" id="refLink" readonly>
                <button class="btn-copy" onclick="copyLink()">Copy</button>
            </div>
        </section>

        <footer>
            Stems Media © 2026 // System Status: Optimal
        </footer>
    </div>

    <script>
        const BASE_URL = "https://crossword.stems.media/?puzzle=";

        const PUZZLES = [
            { title: "Born To<br>Ride", slug: "born-to-ride-2025-09-17", exclusive: true },
            { title: "World<br>Premiere", slug: "world-premiere-2025-09-26", exclusive: false },
            { title: "Coachella<br>Vibes", slug: "coachella-vibes-2025-10-03", exclusive: false },
            { title: "Just<br>Super", slug: "just-super-2025-10-10", exclusive: false },
            { title: "On<br>Deck", slug: "on-deck-2025-10-17", exclusive: false },
            { title: "Stone<br>Classics", slug: "stone-classics-2025-10-25", exclusive: false },
            { title: "Prog<br>Influences", slug: "prog-influences-2025-11-07", exclusive: false },
            { title: "Punks<br>Not Dead", slug: "punks-not-dead-2025-11-14", exclusive: false },
            { title: "Electric<br>Feel", slug: "electric-feel-2025-11-21", exclusive: false },
            { title: "Aughts<br>Rock", slug: "aughts-rock-2025-12-05", exclusive: false },
            { title: "Happy<br>Holidaze", slug: "happy-holidaze-2025-12-12", exclusive: false }
        ];

        function renderVault() {
            const grid = document.getElementById('vaultGrid');
            grid.innerHTML = '';
            PUZZLES.forEach(puzzle => {
                const element = document.createElement('a');
                element.href = BASE_URL + puzzle.slug;
                element.className = 'puzzle-card';
                
                if (puzzle.exclusive) {
                    const badge = document.createElement('span');
                    badge.className = 'exclusive';
                    badge.innerText = 'EXCLUSIVE';
                    element.appendChild(badge);
                }

                const titleSpan = document.createElement('span');
                titleSpan.className = 'puzzle-title';
                titleSpan.innerHTML = puzzle.title;
                
                element.appendChild(titleSpan);
                grid.appendChild(element);
            });
        }

        function copyLink() {
            const copyText = document.getElementById("refLink");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            const btn = document.querySelector('.btn-copy');
            btn.innerHTML = "Copied";
            setTimeout(() => { btn.innerHTML = "Copy"; }, 2000);
        }

        renderVault();
    </script>

</body>
</html>
