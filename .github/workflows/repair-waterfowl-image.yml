name: Repair Waterfowl newsletter image

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-waterfowl-image.yml']

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and test capture checks
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Capture verified Waterfowl grid
        id: screenshot
        env:
          SLUG: waterfowl-2026-10-09
        run: node scripts/screenshot-puzzle.cjs
      - name: Refresh saved snippet and commit image
        env:
          IMAGE_NAME: ${{ steps.screenshot.outputs.image_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('output/waterfowl-2026-10-09-beehiiv.html')
          text = p.read_text()
          old = 'main/images/waterfowl-2026-10-09.png'
          assert text.count(old) == 1, 'Expected original image URL exactly once'
          p.write_text(text.replace(old, 'main/images/' + os.environ['IMAGE_NAME']))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "images/${IMAGE_NAME}" output/waterfowl-2026-10-09-beehiiv.html
          git commit -m 'Repair Waterfowl screenshot and refresh newsletter image URL'
          git push
