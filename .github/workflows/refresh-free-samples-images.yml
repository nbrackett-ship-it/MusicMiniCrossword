name: Refresh Free Samples images
on:
  push:
    paths:
      - '.github/workflows/refresh-free-samples-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture corrected puzzle images
        env:
          SCREENSHOTONE_KEY: ${{ secrets.SCREENSHOTONE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p images
          for slug in free-samples-2026-09-18 the-music-mini-crossword-2026-09-18; do
            target="https://crossword.stems.media/?puzzle=${slug}&v=2"
            encoded=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$target")
            status=$(curl -sS -o "images/${slug}.png" -w '%{http_code}' "https://api.screenshotone.com/take?access_key=${SCREENSHOTONE_KEY}&url=${encoded}&viewport_width=800&viewport_height=800&full_page=false&format=png&block_ads=true&block_cookie_banners=true&hide_selectors%5B%5D=%23sticky-clue-bar")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::Screenshotone returned HTTP $status for $slug"
              exit 1
            fi
          done
      - name: Commit refreshed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/free-samples-2026-09-18.png images/the-music-mini-crossword-2026-09-18.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Free Samples grid images"
            git push
          fi
