<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Music Mini</title>
    <style>
        :root {
            --grid-size: 5; /* Default grid size */
            --cell-size: min(18vw, 70px); /* Responsive cell size */
            --grid-width: calc(var(--grid-size) * var(--cell-size) + (var(--grid-size) - 1px));
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        /* 1. STICKY CLUE BAR */
        #sticky-clue-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 15px;
            background: #1c1c1c;
            border-bottom: 1px solid #333;
            z-index: 100;
            font-size: 15px;
            text-align: center;
            min-height: 20px;
            box-sizing: border-box;
        }

        #sticky-clue-bar .clue-number {
             font-weight: 700;
             margin-right: 5px;
        }

        .main-container {
            width: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
            box-sizing: border-box;
            /* 4. KEYBOARD-SAFE LAYOUT: Add padding to avoid overlap with sticky bar */
            padding-top: 60px; 
            padding-bottom: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 28px;
            font-weight: 700;
        }

        .puzzle-title {
            font-size: 18px;
            color: #b3b3b3;
            margin-bottom: 5px;
        }

        .puzzle-info {
            color: #8a8a8a;
            font-size: 14px;
        }

        .puzzle-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }

        .puzzle-controls button {
            padding: 10px 18px;
            font-size: 14px;
            border: 1px solid #555;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .puzzle-controls button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .puzzle-controls button:disabled {
            background: rgba(255, 255, 255, 0.05);
            cursor: not-allowed;
            color: #666;
        }
        
        /* 2. RESPONSIVE GRID SCALING */
        .crossword-grid {
            display: grid;
            gap: 1px;
            background: #555;
            border: 1px solid #555;
            width: var(--grid-width);
            margin: 0 auto 20px auto;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
        }

        .grid-cell {
            background: #fff;
            position: relative;
        }

        .grid-cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: calc(var(--cell-size) * 0.5);
            font-weight: 600;
            text-transform: uppercase;
            background: transparent;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            color: #121212;
        }

        .grid-cell input:focus {
            outline: none;
        }
        
        .grid-cell.highlight-word {
            background-color: #bbdefb;
        }

        .grid-cell.highlight-active {
            background-color: #64b5f6;
        }

        .black-cell {
            background: #1c1c1c;
        }

        .cell-number {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: calc(var(--cell-size) * 0.25);
            font-weight: 700;
            color: #666;
            pointer-events: none;
        }

        .clues-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .clues-section h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: 600;
        }

        .clue-item {
            margin-bottom: 8px;
            line-height: 1.5;
            font-size: 15px;
        }
        
        #statusMessage { text-align: center; padding: 15px; margin-top: 20px; border-radius: 12px; font-weight: 600; }
        .success { background: #4CAF50; color: white; }

    </style>
</head>

<body>
    <div id="sticky-clue-bar">
        <span class="clue-number"></span>
        <span class="clue-text">Select a square to start</span>
    </div>
    
    <div class="main-container">
        <div class="header">
            <div class="main-title">Music Mini</div>
            <div class="puzzle-title" id="puzzleTitle"></div>
            <div class="puzzle-info" id="puzzleInfo"></div>
        </div>

        <div class="crossword-grid" id="crosswordGrid"></div>

        <div class="puzzle-controls">
            <button id="prevPuzzle">← Previous</button>
            <button id="nextPuzzle">Next →</button>
        </div>

        <div class="clues-container">
            <div class="clues-section">
                <h3>Across</h3>
                <div id="cluesAcross"></div>
            </div>
            <div class="clues-section">
                <h3>Down</h3>
                <div id="cluesDown"></div>
            </div>
        </div>

        <div id="statusMessage"></div>
    </div>


    <script>
        class SimpleCrossword {
            constructor() {
                this.currentPuzzleIndex = 0;
                this.direction = 'across';
                this.activeCell = null;
                this.puzzles = [
                    // Puzzle data remains the same...
                    // "Cycling Playlist"
                    {
                        title: 'Cycling Playlist',
                        info: '2025-07-19 • Medium • 5×5',
                        winMessage: "You're spinning fast!",
                        gridSize: { rows: 5, cols: 5 },
                        words: [
                            { word: 'RACKS', number: 1, direction: 'across', row: 0, col: 0 }, { word: 'IMHIT', number: 6, direction: 'across', row: 1, col: 0 },
                            { word: 'DIALA', number: 7, direction: 'across', row: 2, col: 0 }, { word: 'ERING', number: 8, direction: 'across', row: 3, col: 0 },
                            { word: 'RINSE', number: 9, direction: 'across', row: 4, col: 0 }, { word: 'RIDER', number: 1, direction: 'down', row: 0, col: 0 },
                            { word: 'AMIRI', number: 2, direction: 'down', row: 0, col: 1 }, { word: 'CHAIN', number: 3, direction: 'down', row: 0, col: 2 },
                            { word: 'KILNS', number: 4, direction: 'down', row: 0, col: 3 }, { word: 'STAGE', number: 5, direction: 'down', row: 0, col: 4 }
                        ],
                        clues: {
                            across: [
                                { number: 1, text: 'Places to park bikes or vinyl' }, { number: 6, text: 'Common war movie line' },
                                { number: 7, text: '"In my day, you\'d need to _____ number to request a song."' }, { number: 8, text: 'Oura project category?' }, { number: 9, text: 'Before you repeat, sometimes' }
                            ],
                            down: [
                                { number: 1, text: 'Competitor, or list of requirements' }, { number: 2, text: 'Luxe menswear label in hip-hop/celeb niche' },
                                { number: 3, text: 'Drive component or fashion accessory' }, { number: 4, text: 'Hot spots' }, { number: 5, text: 'Part of a Tour, or a show' }
                            ]
                        }
                    }
                ];
                this.init();
            }

            init() {
                this.loadPuzzle();
                this.setupEvents();
            }

            loadPuzzle() {
                const puzzle = this.puzzles[this.currentPuzzleIndex];
                document.documentElement.style.setProperty('--grid-size', puzzle.gridSize.cols);

                document.getElementById('puzzleTitle').textContent = puzzle.title;
                document.getElementById('puzzleInfo').textContent = puzzle.info;
                document.getElementById('statusMessage').innerHTML = '';
                
                this.generateGrid(puzzle);
                this.updateClues(puzzle);

                document.getElementById('prevPuzzle').disabled = this.currentPuzzleIndex === 0;
                document.getElementById('nextPuzzle').disabled = this.currentPuzzleIndex === this.puzzles.length - 1;
            }

            generateGrid(puzzle) {
                const grid = document.getElementById('crosswordGrid');
                grid.innerHTML = '';
                const gridData = Array(puzzle.gridSize.rows).fill(null).map(() => Array(puzzle.gridSize.cols).fill(null));
                
                puzzle.words.forEach(wordInfo => {
                    let r = wordInfo.row, c = wordInfo.col;
                    for (let i = 0; i < wordInfo.word.length; i++) {
                        if (!gridData[r][c]) gridData[r][c] = { answer: '', across: null, down: null };
                        gridData[r][c].answer = wordInfo.word[i];
                        gridData[r][c][wordInfo.direction] = wordInfo.number;
                        if (i === 0) gridData[r][c].number = wordInfo.number;
                        if (wordInfo.direction === 'across') c++; else r++;
                    }
                });

                for (let r = 0; r < puzzle.gridSize.rows; r++) {
                    for (let c = 0; c < puzzle.gridSize.cols; c++) {
                        const cellData = gridData[r][c];
                        if (!cellData) {
                            grid.appendChild(document.createElement('div')).className = 'black-cell';
                        } else {
                            const cellWrapper = document.createElement('div');
                            cellWrapper.className = 'grid-cell';
                            const input = document.createElement('input');
                            input.type = 'text'; input.maxLength = 1;
                            input.dataset.row = r; input.dataset.col = c;
                            input.dataset.answer = cellData.answer;
                            if (cellData.across) input.dataset.across = cellData.across;
                            if (cellData.down) input.dataset.down = cellData.down;
                            cellWrapper.appendChild(input);
                            if (cellData.number) {
                                const numberSpan = document.createElement('span');
                                numberSpan.className = 'cell-number';
                                numberSpan.textContent = cellData.number;
                                cellWrapper.appendChild(numberSpan);
                            }
                            grid.appendChild(cellWrapper);
                        }
                    }
                }
                this.loadProgress();
            }

            updateClues(puzzle) {
                 const acrossDiv = document.getElementById('cluesAcross');
                 const downDiv = document.getElementById('cluesDown');
                 acrossDiv.innerHTML = '';
                 downDiv.innerHTML = '';

                 puzzle.clues.across.forEach(clue => {
                     const div = document.createElement('div');
                     div.className = 'clue-item';
                     div.innerHTML = `<b>${clue.number}.</b> ${clue.text}`;
                     acrossDiv.appendChild(div);
                 });
                 puzzle.clues.down.forEach(clue => {
                     const div = document.createElement('div');
                     div.className = 'clue-item';
                     div.innerHTML = `<b>${clue.number}.</b> ${clue.text}`;
                     downDiv.appendChild(div);
                 });
            }

            setupEvents() {
                document.getElementById('prevPuzzle').addEventListener('click', () => this.navigate(-1));
                document.getElementById('nextPuzzle').addEventListener('click', () => this.navigate(1));
                
                const grid = document.getElementById('crosswordGrid');
                grid.addEventListener('click', (e) => this.handleCellClick(e));
                grid.addEventListener('input', (e) => this.handleInput(e));
                grid.addEventListener('keydown', (e) => this.handleKeydown(e));
            }

            navigate(direction) {
                this.currentPuzzleIndex += direction;
                this.loadPuzzle();
            }
            
            // 3. TAP-BASED CLUE NAVIGATION LOGIC
            handleCellClick(e) {
                if (e.target.tagName !== 'INPUT') return;
                const input = e.target;
                
                if (input === this.activeCell && input.dataset.across && input.dataset.down) {
                    this.direction = this.direction === 'across' ? 'down' : 'across';
                } else if (!input.dataset[this.direction]) {
                    // If the cell isn't part of the current direction, switch to one it is part of.
                    this.direction = input.dataset.across ? 'across' : 'down';
                }
                
                this.activeCell = input;
                this.highlightWord();
            }
            
            handleInput(e) {
                if (e.target.tagName !== 'INPUT') return;
                const input = e.target;
                input.value = input.value.toUpperCase();
                this.saveProgress();
                if (input.value) this.moveArrow(input, this.direction === 'across' ? 0 : 1, this.direction === 'across' ? 1 : 0);
                this.checkCompletion();
            }

            handleKeydown(e) {
                if (!this.activeCell) return;
                let dr = 0, dc = 0;
                switch (e.key) {
                    case 'ArrowUp': dr = -1; this.direction = 'down'; break;
                    case 'ArrowDown': dr = 1; this.direction = 'down'; break;
                    case 'ArrowLeft': dc = -1; this.direction = 'across'; break;
                    case 'ArrowRight': dc = 1; this.direction = 'across'; break;
                    case 'Backspace':
                        if (!this.activeCell.value) {
                             e.preventDefault();
                             this.moveArrow(this.activeCell, this.direction === 'across' ? 0 : -1, this.direction === 'across' ? -1 : 0);
                        }
                        return;
                    default: return;
                }
                e.preventDefault();
                this.moveArrow(this.activeCell, dr, dc);
            }

            moveArrow(cell, dr, dc) {
                const r = parseInt(cell.dataset.row) + dr;
                const c = parseInt(cell.dataset.col) + dc;
                const nextCell = document.querySelector(`input[data-row='${r}'][data-col='${c}']`);
                if (nextCell) {
                     this.activeCell = nextCell;
                     this.activeCell.focus();
                     this.highlightWord();
                }
            }

            highlightWord() {
                document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('highlight-word', 'highlight-active'));
                if (!this.activeCell) return;
                
                this.activeCell.select();
                const clueNum = this.activeCell.dataset[this.direction];
                if (!clueNum) return;
                
                document.querySelectorAll(`input[data-${this.direction}='${clueNum}']`).forEach(cell => {
                    cell.parentElement.classList.add('highlight-word');
                });
                this.activeCell.parentElement.classList.add('highlight-active');
                this.updateStickyClue(clueNum);
            }

            // 1. UPDATE STICKY CLUE BAR
            updateStickyClue(clueNum) {
                const puzzle = this.puzzles[this.currentPuzzleIndex];
                const clueData = puzzle.clues[this.direction].find(c => c.number == clueNum);
                
                const clueBar = document.getElementById('sticky-clue-bar');
                clueBar.querySelector('.clue-number').textContent = `${clueData.number}.`;
                clueBar.querySelector('.clue-text').textContent = clueData.text;
            }

            loadProgress() { /* ... function remains the same ... */ }
            saveProgress() { /* ... function remains the same ... */ }
            checkCompletion() { /* ... function remains the same ... */ }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new SimpleCrossword();
        });
    </script>
</body>
</html>
