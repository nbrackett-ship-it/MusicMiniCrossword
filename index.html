<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Mini Crossword</title>

  <style>
    /* === CORE STYLING (Courier Theme) === */
    :root{
      --ink:#1B1B1B; --ink-2:#333; --ink-3:#555; --paper:#FFFFFF;
      --rule-strong:3px; --rule-fine:1px;
      --gridMax:560px; --blue:#1877f2;
      /* Define max widths for layout */
      --app-max-width: 960px;
      --grid-panel-width: 560px;
      --clues-panel-width: 340px;
    }

    html,body{ background:var(--paper); margin:0; padding:0; }
    body{
      font-family:"Courier New", Courier, ui-monospace, Menlo, Consolas, monospace;
      color:var(--ink);
      margin:0; padding:20px;
      display:flex; justify-content:center;
      line-height: 1.4;
      font-weight: 500;
    }
    
    #app{ 
      width:100%; 
      max-width:var(--grid-panel-width); /* Mobile-first: constrain to grid width */
      margin: 0 auto;
    }

    /* Header */
    .mm-header{ text-align:center; margin:0 auto 20px auto; }
    .mm-title{ font-size:30px; font-weight:700; letter-spacing:-0.5px; margin:0; }
    .mm-subtitle{ font-size:19px; color:var(--ink-2); margin:8px 0 5px 0; font-weight:600; }
    .mm-meta{ font-size:15px; color:var(--ink-3); margin-bottom:5px; font-weight:500; }
    .mm-instruction{ display:none; } /* Hide the default instruction */
    
    /* FIX: This is the new 2-column wrapper */
    .main-content-wrapper {
      width: 100%;
    }

    /* Grid Panel (Left side on desktop) */
    .grid-panel {
      width: 100%;
    }

    /* Clue Bar (Moved into flow) */
    #sticky-clue-bar{
      display:flex; align-items:center; gap:10px;
      padding:10px 16px; 
      background: var(--paper);
      border:1px solid var(--ink);
      box-shadow: 0 2px 0 rgba(27, 27, 27, 0.12);
      margin: 14px auto 24px;
      font-size:16px;
      font-weight: 500;
      line-height: 1.4;
      box-sizing: border-box; /* Ensure padding doesn't break width */
      text-align: left;
    }
    #sticky-clue-bar .dir{ 
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 14px;
      font-weight: 600;
    }
    #sticky-clue-bar .clue-number{ font-weight:700; }
    #sticky-clue-bar .clue-text{ flex: 1; }
    #sticky-clue-bar .dir:empty,
    #sticky-clue-bar .clue-number:empty {
        display: none;
    }

    /* Grid */
    #crosswordGrid{
      display:grid;
      /* JS will override width/height with pixel-perfect values */
      margin:0 auto 8px auto;
      border: 2px solid var(--ink); /* Main outer border */
      gap: 0;
      background: transparent;
    }
    
    .grid-cell, .black-cell{
      position:relative; background:#fff;
      /* FIX: Individual borders for consistency */
      border: 1px solid var(--ink);
      margin: -0.5px; /* Overlap borders */
    }
    .black-cell{ background:var(--ink); }

    .grid-cell input{
      width:100%; height:100%; text-align:center; border:0;
      font-family:"Courier New", Courier, ui-monospace, Menlo, Consolas, monospace;
      font-size: clamp(20px, 5.5vw, 30px); /* Responsive font size */
      text-transform:uppercase; color:var(--ink);
      caret-color:var(--blue);
      background:transparent;
      font-weight: 700;
      padding: 0; margin: 0; box-sizing: border-box;
    }
    .grid-cell input:focus{
      outline: 2px solid var(--blue);
      outline-offset: -2px;
      z-index: 1;
    }
    
    .cell-number{ 
      position:absolute; top: 2px; left: 3px; 
      font-size: clamp(10px, 2.8vw, 14px);
      font-weight: 700; color:#444; 
      pointer-events: none; 
    }
    
    .highlight-word{ background-color: #e8e8e8; }
    .highlight-active{ background-color: #d8d8d8; }

    /* Clues Panel (Right side on desktop) */
    .clues-panel h2{
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 19px;
      font-weight: 700;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 5px;
    }
    .clues-panel h2:nth-of-type(2) {
      margin-top: 20px; /* Space between Across/Down */
    }
    .clue-item{ 
      margin-bottom: 10px;
      line-height: 1.5;
      font-size: 16px;
      font-weight: 500;
    }
    .clue-item b{ font-weight:700; }

    /* Victory screen */
    #victory-screen{ 
      position:fixed; inset:0; 
      background:rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(5px);
      display:none; /* Changed to none */
      align-items:center; justify-content:center; 
      z-index:1100;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #victory-screen.show {
        display: flex; /* Use flex to show */
        opacity: 1;
    }
    .victory-content { 
      text-align:center; color:var(--ink); 
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }
    #victory-screen.show .victory-content {
        transform: scale(1);
    }
    .victory-icon { font-size: 60px; }
    #victory-message-text{ font-size: 26px; font-weight: 700; margin: 20px 0; }
    #victory-time { font-size: 18px; color: var(--ink-2); margin-top: 10px; font-weight: 500; }
    
    #stars-container{ font-size: 36px; margin: 10px 0; color: var(--ink); letter-spacing: 4px; }
    .star-animate{ display:inline-block; opacity:0; transform:translateY(8px); animation:pop .45s forwards; }
    @keyframes pop{ to{ opacity:1; transform:translateY(0); } }

    /* === FIX: DESKTOP 2-COLUMN LAYOUT === */
    @media (min-width: 900px) { /* Using 900px from LDD */
      #app {
        max-width: var(--app-max-width);
      }
      
      .main-content-wrapper {
        display: flex;
        flex-direction: row;
        gap: 40px;
        justify-content: center;
      }
      
      .grid-panel {
        flex-basis: var(--grid-panel-width);
        flex-shrink: 0; /* Don't shrink grid panel */
      }
      
      .clues-panel {
        flex-basis: var(--clues-panel-width);
        flex-shrink: 0; /* Don't shrink clues panel */
        margin-top: 10px; /* Align tops */
      }
      
      /* Adjust font sizes for desktop */
      .grid-cell input {
          font-size: 30px; /* 55px * 0.55 (from newsletter.html) */
      }
      .cell-number {
          font-size: 15px; /* 55px * 0.28 */
      }
    }
  </style>
</head>
<body>
  
  <div id="app">
    
    <header class="mm-header">
      <h1 class="mm-title">Music Mini</h1>
      <div class="mm-subtitle" id="puzzleTitle">World Premiere</div>
      <div class="mm-meta" id="puzzleInfo">— • —</div>
      <div class="mm-instruction">Select a square to start</div>
    </header>

    <div class="main-content-wrapper">
      
      <main class="grid-panel">
        <div id="sticky-clue-bar" aria-live="polite">
          <span class="dir" id="sticky-dir"></span>
          <span class="clue-number" id="sticky-num"></span>
          <span class="clue-text" id="sticky-text">Select a square to start</span>
        </div>
        <div id="crosswordGrid" aria-label="Crossword grid"></div>
      </main>

      <aside class="clues-panel" id="clues">
        <h2>Across</h2>
        <div id="cluesAcross"></div>
        <h2>Down</h2>
        <div id="cluesDown"></div>
      </aside>
      
    </div> </div> <div id="victory-screen" role="dialog" aria-modal="true">
    <div class="victory-content">
        <div id="victory-icon-container">
            <span class="victory-icon">&#9835;</span>
        </div>
        <div class="victory-message" id="victory-message-text">You did it!</div>
        <div class="victory-time" id="victory-time"></div>
    </div>
  </div>

  <script>
    class SimpleCrossword {
      constructor() {
        this.puzzleIds = [
          'on-deck-2025-10-17',
          'just-super-2025-10-10',
          'coachella-vibes-2025-10-03',
          'world-premiere-2025-09-26',
          'cycling-playlist-2025-07-19'
        ];
        this.currentPuzzleIndex = 0;
        this.currentPuzzleData = null;
        this.direction = 'across';
        this.activeCell = null;
        this.startTime = null;
        this.elapsedTime = 0;
        this.timerInterval = null;
        this.isAutoAdvancing = false;

        this.debouncedResize = this.debounce(this.resizeGrid.bind(this), 250);
        this.init();
      }

      async init() {
        this.setupEvents();
        window.addEventListener('resize', this.debouncedResize);

        const puzzleIdFromUrl = this.getPuzzleIdFromUrl();
        const idx = this.puzzleIds.indexOf(puzzleIdFromUrl);
        this.currentPuzzleIndex = idx !== -1 ? idx : 0;
        await this.loadPuzzleById(this.puzzleIds[this.currentPuzzleIndex]);
      }

      getPuzzleIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('puzzle');
      }

      async loadPuzzleById(puzzleId) {
        try {
          const res = await fetch(`/puzzles/${puzzleId}.json`, { cache: 'no-store' });
          if (!res.ok) throw new Error(`Failed to load puzzle ${puzzleId}`);
          this.currentPuzzleData = await res.json();
          this.renderPuzzle();
        } catch(e) {
          console.error(e);
          document.getElementById('puzzleTitle').textContent = "Puzzle Not Found";
        }
      }

      renderPuzzle() {
        const p = this.currentPuzzleData;
        document.querySelector('.mm-subtitle').textContent = p.title;
        document.querySelector('#puzzleInfo').textContent = p.info;
        this.generateGrid(p);
        this.updateClues(p);
        this.loadProgress();
        this.resetTimer();
        this.resetClueBar();
      }

      // FIX: resizeGrid now constrains itself on desktop
      resizeGrid() {
        const p = this.currentPuzzleData;
        if (!p) return;

        const grid = document.getElementById('crosswordGrid');
        const { cols } = p.gridSize;

        // Get constraints
        const rootStyles = getComputedStyle(document.documentElement);
        const maxGridPx = parseInt(rootStyles.getPropertyValue('--gridMax') || '560');
        const containerWidth = grid.parentElement.clientWidth;
        
        // On desktop, parent width is constrained by CSS, but we still cap at --gridMax
        // On mobile, parent width is screen width, so we cap at --gridMax
        const targetWidth = Math.min(containerWidth, maxGridPx);

        // Use Math.floor() to guarantee an integer pixel value
        const cellSize = Math.floor(targetWidth / cols);
        const finalGridWidth = cellSize * cols;

        // Apply the exact pixel dimensions to the grid container.
        grid.style.width = `${finalGridWidth}px`;
        grid.style.height = `${finalGridWidth}px`;

        // Also apply this width to the clue bar so they match.
        const clueBar = document.getElementById('sticky-clue-bar');
        if (clueBar) {
            clueBar.style.width = `${finalGridWidth}px`;
        }
      }

      generateGrid(puzzle) {
        const grid = document.getElementById('crosswordGrid');
        grid.innerHTML = '';

        const { rows, cols } = puzzle.gridSize;
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        grid.style.gridTemplateRows   = `repeat(${rows}, 1fr)`;

        const gridData = Array.from({ length: rows }, () => Array(cols).fill(null));
        puzzle.words.forEach(w => {
          let r = w.row, c = w.col;
          for (let i = 0; i < w.word.length; i++) {
            if (!gridData[r][c]) gridData[r][c] = {answer:'', across:null, down:null};
            gridData[r][c].answer = w.word[i];
            gridData[r][c][w.direction] = w.number;
            if (i===0) gridData[r][c].number = w.number;
            w.direction === 'across' ? c++ : r++;
          }
        });

        for (let r=0; r<rows; r++){
          for (let c=0; c<cols; c++){
            const cell = gridData[r][c];
            const div = document.createElement('div');
            
            if (!cell) {
              div.className = 'black-cell';
              grid.appendChild(div);
            } else {
              div.className = 'grid-cell';
              const input = document.createElement('input');
              input.type='text'; input.maxLength=1;
              input.dataset.row=r; input.dataset.col=c;
              input.dataset.answer=cell.answer;
              if (cell.across) input.dataset.across=cell.across;
              if (cell.down) input.dataset.down=cell.down;
              div.appendChild(input);

              if (cell.number){
                const num = document.createElement('span');
                num.className = 'cell-number'; num.textContent = cell.number;
                div.appendChild(num);
              }
              grid.appendChild(div);
            }
          }
        }
        // Set initial size after the grid has been added to the DOM.
        this.resizeGrid();
      }

      updateClues(puzzle){
        const acrossEl = document.getElementById('cluesAcross');
        const downEl = document.getElementById('cluesDown');
        acrossEl.innerHTML = ''; downEl.innerHTML = '';
        puzzle.clues.across.forEach(c => {
          acrossEl.innerHTML += `<div class="clue-item"><b>${c.number}.</b> ${c.text}</div>`;
        });
        puzzle.clues.down.forEach(c => {
          downEl.innerHTML += `<div class="clue-item"><b>${c.number}.</b> ${c.text}</div>`;
        });
      }

      setupEvents(){
        const grid = document.getElementById('crosswordGrid');
        grid.addEventListener('click', e => this.handleCellClick(e));
        grid.addEventListener('input', e => this.handleInput(e));
        grid.addEventListener('keydown', e => this.handleKeydown(e));
        grid.addEventListener('focusin', e => {
            if (this.isAutoAdvancing) return;
            if (e.target.tagName === 'INPUT') this.handleCellClick(e);
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) this.stopTimer();
          else if (this.startTime && !this.checkIfComplete()) this.startTimer();
        });
        document.getElementById('victory-screen').addEventListener('click', () => {
          document.getElementById('victory-screen').classList.remove('show');
        });
      }

      handleCellClick(e){
        if (e.target.tagName !== 'INPUT') return;
        const input = e.target;
        
        if (input === this.activeCell && input.dataset.across && input.dataset.down){
          this.direction = this.direction === 'across' ? 'down' : 'across';
        } 
        else {
          if (!input.dataset[this.direction]){
            this.direction = input.dataset.across ? 'across' : 'down';
          }
        }
        
        this.activeCell = input;
        input.focus(); 
        this.highlightWord();
      }

      handleInput(e){
        if (e.target.tagName !== 'INPUT') return;
        const input = e.target;
        input.value = input.value.toUpperCase();
        if (!this.timerInterval && input.value) this.startTimer();
        this.saveProgress();
        if (input.value) {
          this.isAutoAdvancing = true;
          this.moveInDirection(input, this.direction);
          this.isAutoAdvancing = false;
        }
        this.checkCompletion();
      }

      handleKeydown(e){
        if (!this.activeCell) return;
        let dr=0, dc=0;
        switch(e.key){
          case 'ArrowUp': dr=-1; this.direction='down'; break;
          case 'ArrowDown': dr=1; this.direction='down'; break;
          case 'ArrowLeft': dc=-1; this.direction='across'; break;
          case 'ArrowRight': dc=1; this.direction='across'; break;
          case 'Backspace':
            e.preventDefault();
            if (this.activeCell.value) { this.activeCell.value = ''; }
            else { 
                this.isAutoAdvancing = true;
                this.moveInDirection(this.activeCell, this.direction, true); 
                this.isAutoAdvancing = false;
            }
            this.saveProgress(); // Save on backspace
            return;
          default: return;
        }
        e.preventDefault();
        this.moveArrow(this.activeCell, dr, dc);
      }

      moveInDirection(cell, direction, isBackspace = false) {
        const r = parseInt(cell.dataset.row);
        const c = parseInt(cell.dataset.col);
        const move = isBackspace ? -1 : 1;
        
        let nextR = r, nextC = c;
        if (direction === 'across') {
          nextC = c + move;
        } else {
          nextR = r + move;
        }
        
        const next = document.querySelector(`input[data-row='${nextR}'][data-col='${nextC}']`);
        if (next) {
          this.activeCell = next;
          next.focus();
          this.highlightWord();
        }
      }
      
      moveArrow(cell, dr, dc){
        const r = parseInt(cell.dataset.row) + dr;
        const c = parseInt(cell.dataset.col) + dc;
        const next = document.querySelector(`input[data-row='${r}'][data-col='${c}']`);
        if (next) { this.activeCell = next; next.focus(); this.highlightWord(); }
      }

      highlightWord(){
        document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('highlight-word','highlight-active'));
        if (!this.activeCell) return;
        this.activeCell.select();
        const clueNum = this.activeCell.dataset[this.direction];
        if (!clueNum) {
            this.resetClueBar(); // Reset if we're on a cell with no clue
            return;
        }
        document.querySelectorAll(`input[data-${this.direction}='${clueNum}']`).forEach(cell => {
          cell.parentElement.classList.add('highlight-word');
        });
        this.activeCell.parentElement.classList.add('highlight-active');
        
        // Update sticky bar
        const clue = this.currentPuzzleData.clues[this.direction].find(c => c.number == clueNum);
        document.getElementById('sticky-dir').textContent = this.direction;
        document.getElementById('sticky-num').textContent = `${clue.number}.`;
        document.getElementById('sticky-text').textContent = clue.text;
      }
      
      resetClueBar() {
        document.getElementById('sticky-dir').textContent = '';
        document.getElementById('sticky-num').textContent = '';
        document.getElementById('sticky-text').textContent = 'Select a square to start';
      }

      startTimer(){
        if (!this.startTime) this.startTime = Date.now() - this.elapsedTime*1000;
        if (!this.timerInterval){
          this.timerInterval = setInterval(() => {
            this.elapsedTime = Math.floor((Date.now() - this.startTime)/1000);
          }, 1000);
        }
      }
      stopTimer(){ if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval=null; } }
      resetTimer(){ this.stopTimer(); this.startTime = null; this.elapsedTime = 0; }
      formatTime(s){ const m=Math.floor(s/60), sec=(s%60).toString().padStart(2,'0'); return `${m}:${sec}`; }
      
      getRanking(seconds){
        if (seconds<=30) return {stars:"★★★★★", text:"Instant Classic"};
        if (seconds<=60) return {stars:"★★★★☆", text:"Truly Great"};
        if (seconds<=90) return {stars:"★★★★",  text:"Excellent"};
        if (seconds<=120) return {stars:"★★★☆", text:"Damn Good"};
        if (seconds<=240) return {stars:"★★★",   text:"Good"};
        return {stars:"★★", text:"Decent Effort"};
      }
      
      showVictoryScreen(){
        this.stopTimer();
        const p=this.currentPuzzleData;
        const ranking = this.getRanking(this.elapsedTime);
        document.getElementById('victory-message-text').textContent = p.winMessage || "You did it!";
        document.getElementById('victory-time').innerHTML = `
          <div id="stars-container">
            ${ranking.stars.split('').map((s,i) => `<span class="star-animate" style="animation-delay:${i*0.1}s">${s}</span>`).join('')}
          </div>
          <div style="font-size: 22px; font-weight: 700; margin-bottom: 10px;">${ranking.text}</div>
          <div style="font-size: 17px; color: #444; font-weight: 600;">Your Time: ${this.formatTime(this.elapsedTime)}</div>`;
        document.getElementById('victory-screen').classList.add('show');
      }

      storageKey(){ return `mm-progress:${this.currentPuzzleData.id}`; }
      saveProgress(){
        const inputs=[...document.querySelectorAll('.grid-cell input')];
        const data=inputs.map(i=>({r:i.dataset.row, c:i.dataset.col, v:i.value||''}));
        localStorage.setItem(this.storageKey(), JSON.stringify({data, t:this.elapsedTime}));
      }
      loadProgress(){
        const blob = localStorage.getItem(this.storageKey());
        if (!blob) return;
        try{
          const {data,t}=JSON.parse(blob);
          if (!data) return;
          const byKey = new Map(data.map(d=>[`${d.r},${d.c}`, d.v]));
          document.querySelectorAll('.grid-cell input').forEach(i=>{
            i.value = (byKey.get(`${i.dataset.row},${i.dataset.col}`) || '').toUpperCase();
          });
          if (t && Number.isFinite(t) && t > 0) {
              this.elapsedTime = t;
              this.startTimer();
          }
          this.checkCompletion(); // Check if loaded state is already complete
        } catch(e){ console.error("Could not load progress", e); }
      }

      checkIfComplete(){
        const inputs=document.querySelectorAll('.grid-cell input');
        if (inputs.length === 0) return false;
        for(const input of inputs){
          if (input.value.toUpperCase() !== input.dataset.answer) return false;
        }
        return true;
      }
      checkCompletion(){
        if (!this.checkIfComplete()) return;
        this.showVictoryScreen();
      }

      debounce(func, wait) {
          let timeout;
          return function executedFunction(...args) {
              const later = () => { clearTimeout(timeout); func(...args); };
              clearTimeout(timeout);
              timeout = setTimeout(later, wait);
          };
      }
    }

    document.addEventListener('DOMContentLoaded', () => { new SimpleCrossword(); });
  </script>
</body>
</html>
