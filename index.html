<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Mini Crossword</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f0f2f5;
            color: #1c1e21;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .puzzle-title {
            font-size: 20px;
            font-weight: 600;
        }

        .puzzle-info {
            color: #606770;
            font-size: 14px;
        }

        .puzzle-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .puzzle-controls button {
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid #ccd0d5;
            border-radius: 6px;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .puzzle-controls button:hover {
            background-color: #f0f2f5;
        }

        .puzzle-controls button:disabled {
            background-color: #e4e6eb;
            cursor: not-allowed;
            color: #bcc0c4;
        }

        #timer {
            font-size: 14px;
            font-weight: 400;
            color: #606770;
            margin-top: 10px;
        }

        .crossword-container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background-color: #000;
            margin: 0 auto 20px auto;
            border: 1px solid #000;
            width: fit-content;
        }

        .grid-cell {
            background-color: white;
            width: 40px;
            height: 40px;
            position: relative;
        }

        .grid-cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 18px;
            font-weight: 500;
            text-transform: uppercase;
            background: transparent;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .grid-cell input:focus {
            outline: 2px solid #1877f2;
            z-index: 1;
        }

        .black-cell {
            background-color: black;
        }

        .cell-number {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 10px;
            font-weight: 600;
            color: #606770;
            pointer-events: none;
        }

        .clues-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .clues-section h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .clue-item {
            margin-bottom: 5px;
            line-height: 1.4;
            font-size: 14px;
        }

        #statusMessage {
            text-align: center;
            padding: 10px;
            margin-top: 20px;
            border-radius: 6px;
            font-weight: 500;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            font-size: 18px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="main-title">The Micro Music Crossword</div>
        <div class="puzzle-title" id="puzzleTitle"></div>
        <div class="puzzle-info" id="puzzleInfo"></div>
        <div id="timer">00:00</div>
    </div>

    <div class="puzzle-controls">
        <button id="prevPuzzle">← Previous</button>
        <button id="nextPuzzle">Next →</button>
    </div>

    <div class="crossword-container">
        <div class="crossword-grid" id="crosswordGrid"></div>
        <div class="clues-container">
            <div class="clues-section">
                <h3>Across</h3>
                <div id="cluesAcross"></div>
            </div>
            <div class="clues-section">
                <h3>Down</h3>
                <div id="cluesDown"></div>
            </div>
        </div>
    </div>

    <div id="statusMessage"></div>

    <script>
        class SimpleCrossword {
            constructor() {
                this.currentPuzzleIndex = 0;
                this.direction = 'across';
                this.startTime = null;
                this.timerInterval = null;
                this.elapsedTime = 0;

                this.puzzles = [
                    {
                        title: 'Global Rollout',
                        info: '2025-07-16 • 5×5',
                        winMessage: "Sweet!",
                        gridSize: {rows: 5, cols: 5},
                        words: [
                            {word: 'YORKE', number: 1, direction: 'across', row: 0, col: 0},
                            {word: 'ARENA', number: 6, direction: 'across', row: 1, col: 0},
                            {word: 'NIGER', number: 7, direction: 'across', row: 2, col: 0},
                            {word: 'NOEL', number: 8, direction: 'across', row: 3, col: 0},
                            {word: 'INTL', number: 9, direction: 'across', row: 4, col: 0},
                            {word: 'YANNI', number: 1, direction: 'down', row: 0, col: 0},
                            {word: 'ORION', number: 2, direction: 'down', row: 0, col: 1},
                            {word: 'REGET', number: 3, direction: 'down', row: 0, col: 2},
                            {word: 'KNELL', number: 4, direction: 'down', row: 0, col: 3},
                            {word: 'EAR', number: 5, direction: 'down', row: 0, col: 4}
                        ],
                        clues: {
                            across: [
                                {number: 1, text: 'Ambition makes you look pretty ugly, he sang'},
                                {number: 6, text: 'One step above a shed'},
                                {number: 7, text: 'West African nation, not to be confused with the Afrobeats mecca'},
                                {number: 8, text: 'Tolerating his brother this summer'},
                                {number: 9, text: 'Global (abbr.)'}
                            ],
                            down: [
                                {number: 1, text: 'A lord of the keytar'},
                                {number: 2, text: 'Master of Puppets deep cut'},
                                {number: 3, text: 'Obtain again?'},
                                {number: 4, text: 'Sound of a bell, often funereal'},
                                {number: 5, text: 'Trust yours'}
                            ]
                        }
                    },
                    {
                        title: 'Classic Hip-Hop and Whatnot',
                        info: '2025-07-17 • 5×5',
                        winMessage: "You know your history!",
                        gridSize: {rows: 5, cols: 5},
                        words: [
                            {word: 'GRIFF', number: 1, direction: 'across', row: 0, col: 0},
                            {word: 'RECUR', number: 5, direction: 'across', row: 1, col: 0},
                            {word: 'INIGO', number: 6, direction: 'across', row: 2, col: 0},
                            {word: 'TONES', number: 7, direction: 'across', row: 3, col: 0},
                            {word: 'GET', number: 8, direction: 'across', row: 4, col: 2},
                            {word: 'GRIT', number: 1, direction: 'down', row: 0, col: 0},
                            {word: 'RENO', number: 2, direction: 'down', row: 0, col: 1},
                            {word: 'ICING', number: 3, direction: 'down', row: 0, col: 2},
                            {word: 'FUGEE', number: 4, direction: 'down', row: 0, col: 3},
                            {word: 'FROST', number: 5, direction: 'down', row: 0, col: 4}
                        ],
                        clues: {
                            across: [
                                {number: 1, text: 'Problematic PE member'},
                                {number: 5, text: 'What choruses and hooks do'},
                                {number: 6, text: 'This movie character said "My name is..." well before Eminem'},
                                {number: 7, text: 'Adjust these on a mixer'},
                                {number: 8, text: '_____ money'}
                            ],
                            down: [
                                {number: 1, text: 'DJ Premier beats had this'},
                                {number: 2, text: 'Garcia lit out from here, chased by 20 hounds'},
                                {number: 3, text: 'Period slang for gangland kill'},
                                {number: 4, text: 'Singular form of 90s hip-hop mega-trio'},
                                {number: 5, text: 'Kid who broke down doors for Hispanic MC\'s'}
                            ]
                        }
                    },
                    {
                        title: 'Pop Life: 2010s & Beyond',
                        info: '2025-07-17 • 5×5',
                        winMessage: "You're plugged into the zeitgeist!",
                        gridSize: {rows: 5, cols: 5},
                        words: [
                            {word: 'HULK', number: 1, direction: 'across', row: 0, col: 1},
                            {word: 'GENIE', number: 6, direction: 'across', row: 1, col: 0},
                            {word: 'RITZY', number: 7, direction: 'across', row: 2, col: 0},
                            {word: 'ADAZE', number: 8, direction: 'across', row: 3, col: 0},
                            {word: 'MIGOS', number: 9, direction: 'across', row: 4, col: 0},
                            {word: 'GRAM', number: 1, direction: 'down', row: 0, col: 1},
                            {word: 'HEIDI', number: 2, direction: 'down', row: 0, col: 2},
                            {word: 'UNTAG', number: 3, direction: 'down', row: 0, col: 3},
                            {word: 'LIZZO', number: 4, direction: 'down', row: 0, col: 4},
                            {word: 'KEYES', number: 5, direction: 'down', row: 1, col: 4}
                        ],
                        clues: {
                            across: [
                                {number: 1, text: 'Superhero + erstwhile metaphor for emotional volatility'},
                                {number: 6, text: 'Mystical figure in Xtina\'s breakthrough hit'},
                                {number: 7, text: 'Target vibe in some music videos'},
                                {number: 8, text: 'Mentally fuzzy (with "in")'},
                                {number: 9, text: '2010s trio with triplet flow'}
                            ],
                            down: [
                                {number: 1, text: 'Small measurement, or place where people flex (with "the")'},
                                {number: 2, text: 'First name of reality star with 2010s pop ambitions'},
                                {number: 3, text: 'A quiet way to take someone out of the picture, sometimes'},
                                {number: 4, text: 'Female MC/singer with record breaking chart run at end of decade'},
                                {number: 5, text: 'The Grammys love to go to her'}
                            ]
                        }
                    }
                ];
                this.init();
            }

            init() {
                this.loadPuzzle();
                this.setupEvents();
            }

            loadPuzzle() {
                const puzzle = this.puzzles[this.currentPuzzleIndex];
                document.getElementById('puzzleTitle').textContent = puzzle.title;
                document.getElementById('puzzleInfo').textContent = puzzle.info;
                document.getElementById('statusMessage').innerHTML = '';

                this.generateGrid(puzzle);
                this.updateClues(puzzle);
                this.startTimer();

                document.getElementById('prevPuzzle').disabled = this.currentPuzzleIndex === 0;
                document.getElementById('nextPuzzle').disabled = this.currentPuzzleIndex === this.puzzles.length - 1;
            }

            startTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                this.startTime = Date.now();
                const timerElement = document.getElementById('timer');
                this.timerInterval = setInterval(() => {
                    this.elapsedTime = Date.now() - this.startTime;
                    timerElement.textContent = this.formatTime(this.elapsedTime);
                }, 1000);
            }

            stopTimer() {
                clearInterval(this.timerInterval);
                this.elapsedTime = Date.now() - this.startTime;
            }

            formatTime(ms) {
                const totalSeconds = Math.floor(ms / 1000);
                const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                const seconds = (totalSeconds % 60).toString().padStart(2, '0');
                return `${minutes}:${seconds}`;
            }

            generateGrid(puzzle) {
                const grid = document.getElementById('crosswordGrid');
                const {rows, cols} = puzzle.gridSize;
                grid.style.gridTemplateColumns = `repeat(${cols}, 40px)`;
                grid.style.gridTemplateRows = `repeat(${rows}, 40px)`;
                grid.innerHTML = '';

                const gridData = Array(rows).fill(null).map(() => Array(cols).fill(null));

                puzzle.words.forEach(wordInfo => {
                    let r = wordInfo.row;
                    let c = wordInfo.col;
                    for (let i = 0; i < wordInfo.word.length; i++) {
                        if (r >= rows || c >= cols) continue;
                        if (!gridData[r][c]) {
                            gridData[r][c] = {answer: '', across: null, down: null};
                        }
                        gridData[r][c].answer = wordInfo.word[i];
                        gridData[r][c][wordInfo.direction] = wordInfo.number;

                        if (i === 0) {
                            gridData[r][c].number = wordInfo.number;
                        }

                        if (wordInfo.direction === 'across') c++;
                        else r++;
                    }
                });

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const cellData = gridData[r][c];
                        if (!cellData) {
                            const blackCell = document.createElement('div');
                            blackCell.className = 'black-cell';
                            grid.appendChild(blackCell);
                        } else {
                            const cellWrapper = document.createElement('div');
                            cellWrapper.className = 'grid-cell';

                            const input = document.createElement('input');
                            input.type = 'text';
                            input.maxLength = 1;
                            input.dataset.row = r;
                            input.dataset.col = c;
                            input.dataset.answer = cellData.answer;
                            if (cellData.across) input.dataset.across = cellData.across;
                            if (cellData.down) input.dataset.down = cellData.down;

                            cellWrapper.appendChild(input);

                            if (cellData.number) {
                                const numberSpan = document.createElement('span');
                                numberSpan.className = 'cell-number';
                                numberSpan.textContent = cellData.number;
                                cellWrapper.appendChild(numberSpan);
                            }
                            grid.appendChild(cellWrapper);
                        }
                    }
                }

                this.loadProgress();
            }

            loadProgress() {
                const key = `crossword-progress-${this.currentPuzzleIndex}`;
                const savedData = localStorage.getItem(key);
                if (savedData) {
                    const progress = JSON.parse(savedData);
                    for (const cellId in progress) {
                        const cell = document.querySelector(`input[data-row='${cellId.split('-')[0]}'][data-col='${cellId.split('-')[1]}']`);
                        if (cell) {
                            cell.value = progress[cellId];
                        }
                    }
                }
            }

            saveProgress() {
                const key = `crossword-progress-${this.currentPuzzleIndex}`;
                const progress = {};
                const inputs = document.querySelectorAll('.grid-cell input');
                inputs.forEach(input => {
                    if (input.value) {
                        const cellId = `${input.dataset.row}-${input.dataset.col}`;
                        progress[cellId] = input.value;
                    }
                });
                localStorage.setItem(key, JSON.stringify(progress));
            }

            updateClues(puzzle) {
                const acrossDiv = document.getElementById('cluesAcross');
                const downDiv = document.getElementById('cluesDown');
                acrossDiv.innerHTML = '';
                downDiv.innerHTML = '';

                puzzle.clues.across.forEach(clue => {
                    const div = document.createElement('div');
                    div.className = 'clue-item';
                    div.innerHTML = `<b>${clue.number}.</b> ${clue.text}`;
                    acrossDiv.appendChild(div);
                });
                puzzle.clues.down.forEach(clue => {
                    const div = document.createElement('div');
                    div.className = 'clue-item';
                    div.innerHTML = `<b>${clue.number}.</b> ${clue.text}`;
                    downDiv.appendChild(div);
                });
            }

            setupEvents() {
                document.getElementById('prevPuzzle').addEventListener('click', () => this.navigate(-1));
                document.getElementById('nextPuzzle').addEventListener('click', () => this.navigate(1));
                const grid = document.getElementById('crosswordGrid');
                grid.addEventListener('input', (e) => this.handleInput(e));
                grid.addEventListener('keydown', (e) => this.handleKeydown(e));
                grid.addEventListener('focusin', (e) => this.handleFocus(e));
            }

            navigate(direction) {
                if (this.timerInterval) clearInterval(this.timerInterval);
                this.currentPuzzleIndex += direction;
                this.loadPuzzle();
            }

            handleFocus(e) {
                if (e.target.tagName !== 'INPUT') return;
                const input = e.target;

                input.select();

                if (input.dataset.across && input.dataset.down) {
                    // Keep current direction
                } else if (input.dataset.across) {
                    this.direction = 'across';
                } else if (input.dataset.down) {
                    this.direction = 'down';
                }
                this.highlightWord(input);
            }

            handleInput(e) {
                if (e.target.tagName !== 'INPUT') return;
                const input = e.target;
                input.value = input.value.toUpperCase();

                this.saveProgress();

                if (input.value) {
                    if (this.direction === 'across') this.moveArrow(input, 0, 1);
                    else this.moveArrow(input, 1, 0);
                }
                this.checkCompletion();
            }

            handleKeydown(e) {
                if (e.target.tagName !== 'INPUT') return;
                const input = e.target;
                if (e.key === 'Backspace' && !input.value) {
                    e.preventDefault();
                    if (this.direction === 'across') this.moveArrow(input, 0, -1);
                    else this.moveArrow(input, -1, 0);
                } else if (e.key.startsWith('Arrow')) {
                    e.preventDefault();
                    let dr = 0, dc = 0;
                    if (e.key === 'ArrowUp') {dr = -1; this.direction = 'down';}
                    if (e.key === 'ArrowDown') {dr = 1; this.direction = 'down';}
                    if (e.key === 'ArrowLeft') {dc = -1; this.direction = 'across';}
                    if (e.key === 'ArrowRight') {dc = 1; this.direction = 'across';}
                    this.moveArrow(input, dr, dc);
                } else if (e.key === 'Tab' || e.key === 'Enter') {
                    e.preventDefault();
                    if (input.dataset.across && input.dataset.down) {
                        this.direction = this.direction === 'across' ? 'down' : 'across';
                        this.highlightWord(input);
                    }
                }
            }

            moveArrow(cell, dr, dc) {
                const r = parseInt(cell.dataset.row) + dr;
                const c = parseInt(cell.dataset.col) + dc;
                const nextCell = document.querySelector(`input[data-row='${r}'][data-col='${c}']`);
                if (nextCell) nextCell.focus();
            }

            highlightWord(currentInput) {
                document.querySelectorAll('.grid-cell').forEach(c => {
                    const bg = c.querySelector('input') ? 'white' : 'black';
                    c.style.backgroundColor = bg;
                });

                const clueNum = currentInput.dataset[this.direction];
                if (!clueNum) return;

                document.querySelectorAll(`input[data-${this.direction}='${clueNum}']`).forEach(cell => {
                    cell.parentElement.style.backgroundColor = '#dbeafe'; // Light blue for word
                });
                currentInput.parentElement.style.backgroundColor = '#bfdbfe'; // Darker blue for current cell
            }

            checkCompletion() {
                const inputs = document.querySelectorAll('.grid-cell input');
                for (const input of inputs) {
                    if (input.value.toUpperCase() !== input.dataset.answer) return;
                }

                this.stopTimer();
                const puzzle = this.puzzles[this.currentPuzzleIndex];
                const finalTime = this.formatTime(this.elapsedTime);

                const messageDiv = document.getElementById('statusMessage');
                messageDiv.innerHTML = `
                    <div>${puzzle.winMessage}</div>
                    <div>You finished in ${finalTime}</div>
                `;
                messageDiv.className = 'status-message success';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new SimpleCrossword();
        });
    </script>
</body>

</html>
