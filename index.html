<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Music Mini</title>
    <style>
        :root {
            --grid-size: 5;
            --cell-size-mobile: 18vw;
            --cell-size-desktop: 55px;
            --grid-width-mobile: calc(var(--grid-size) * var(--cell-size-mobile) + (var(--grid-size) - 1px));
            --grid-width-desktop: calc(var(--grid-size) * var(--cell-size-desktop) + (var(--grid-size) - 1px));
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #121212;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        #sticky-clue-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 2px solid #1877f2;
            z-index: 100;
            font-size: 15px;
            text-align: center;
            min-height: 20px;
            box-sizing: border-box;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
            color: #1c1e21;
        }

        #sticky-clue-bar .clue-number {
            font-weight: 700;
            color: #1877f2;
            margin-right: 8px;
        }

        #sticky-clue-bar .clue-text {
            font-weight: 500;
            color: #1c1e21;
        }

        .main-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
            box-sizing: border-box;
            padding-top: 60px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .main-title { font-size: 28px; font-weight: 700; }
        .puzzle-title { font-size: 18px; color: #b3b3b3; margin-bottom: 5px; }
        .puzzle-info { color: #8a8a8a; font-size: 14px; }

        .puzzle-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }
        .puzzle-controls button {
            padding: 10px 18px; font-size: 14px; border: 1px solid #555;
            border-radius: 8px; background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0; cursor: pointer; transition: background-color 0.2s;
        }
        .puzzle-controls button:hover { background: rgba(255, 255, 255, 0.2); }
        .puzzle-controls button:disabled { background: rgba(255, 255, 255, 0.05); cursor: not-allowed; color: #666; }

        .crossword-grid {
            display: grid; gap: 1px; background: #555; border: 1px solid #555;
            margin: 0 auto 20px auto;
            width: var(--grid-width-mobile);
            grid-template-columns: repeat(var(--grid-size), var(--cell-size-mobile));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size-mobile));
        }
        .grid-cell { background: #fff; position: relative; }
        .grid-cell input {
            width: 100%; height: 100%; border: none; text-align: center;
            font-size: calc(var(--cell-size-mobile) * 0.5); font-weight: 600; text-transform: uppercase;
            background: transparent; padding: 0; margin: 0; box-sizing: border-box; color: #121212;
        }
        .grid-cell input:focus { outline: none; }
        .grid-cell.highlight-word { background-color: #bbdefb; }
        .grid-cell.highlight-active { background-color: #64b5f6; }
        .black-cell { background: #1c1c1c; }
        .cell-number {
            position: absolute; top: 2px; left: 3px;
            font-size: calc(var(--cell-size-mobile) * 0.25);
            font-weight: 700; color: #666; pointer-events: none;
        }

        .clues-container { display: flex; flex-direction: column; gap: 20px; }
        .clues-section h3 { margin-top: 0; margin-bottom: 10px; font-size: 18px; font-weight: 600; }
        .clue-item { margin-bottom: 8px; line-height: 1.5; font-size: 15px; }

        #victory-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 200; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #victory-screen.show { opacity: 1; pointer-events: auto; }
        .victory-content {
            text-align: center; color: white;
            transform: scale(0.9); transition: transform 0.3s ease;
        }
        #victory-screen.show .victory-content { transform: scale(1); }
        .victory-icon { font-size: 60px; animation: bounce 0.8s ease-in-out; }
        .victory-gif { max-width: 80vw; max-height: 40vh; border-radius: 12px; margin-bottom: 20px; }
        .victory-message { font-size: 24px; font-weight: 700; margin: 20px 0; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        @media (min-width: 768px) {
            body {
                height: auto;
                overflow: auto;
            }

            #sticky-clue-bar {
                display: none;
            }

            .main-container {
                height: auto;
                overflow: visible;
                display: flex;
                flex-direction: row;
                align-items: flex-start;
                gap: 40px;
                padding: 40px 20px;
                max-width: 1200px;
                margin: 0 auto;
            }

            .left-panel { flex-shrink: 0; }
            .clues-container { flex-grow: 1; }

            .header, .puzzle-controls {
                margin-left: auto;
                margin-right: auto;
                width: var(--grid-width-desktop);
            }

            .crossword-grid {
                width: var(--grid-width-desktop);
                grid-template-columns: repeat(var(--grid-size), var(--cell-size-desktop));
                grid-template-rows: repeat(var(--grid-size), var(--cell-size-desktop));
            }

            .grid-cell input { font-size: calc(var(--cell-size-desktop) * 0.5); }
            .cell-number { font-size: calc(var(--cell-size-desktop) * 0.25); }
        }
    </style>
</head>

<body>
    <div id="sticky-clue-bar">
        <span class="clue-number"></span>
        <span class="clue-text">Select a square to start</span>
    </div>

    <div class="main-container">
        <div class="left-panel">
            <div class="header">
                <div class="main-title">Music Mini</div>
                <div class="puzzle-title" id="puzzleTitle"></div>
                <div class="puzzle-info" id="puzzleInfo"></div>
            </div>
            <div class="crossword-grid" id="crosswordGrid"></div>
            <div class="puzzle-controls">
                <button id="prevPuzzle">← Previous</button>
                <button id="nextPuzzle">Next →</button>
            </div>
        </div>

        <div class="clues-container">
            <div class="clues-section">
                <h3>Across</h3>
                <div id="cluesAcross"></div>
            </div>
            <div class="clues-section">
                <h3>Down</h3>
                <div id="cluesDown"></div>
            </div>
        </div>
    </div>

    <div id="victory-screen">
        <div class="victory-content">
            <div id="victory-icon-container">
                 <span class="victory-icon">&#9835;</span>
            </div>
            <div id="victory-gif-container"></div>
            <div class="victory-message" id="victory-message-text">You did it!</div>
        </div>
    </div>


    <script>
        class SimpleCrossword {
            constructor() {
                this.currentPuzzleIndex = 0;
                this.direction = 'across';
                this.activeCell = null;
                this.userToken = null;
                this.puzzles = [
                    {
                        id: 'cycling-playlist-2025-07-19',
                        title: 'Cycling Playlist',
                        info: '2025-07-19 • Medium • 5×5',
                        gridSize: { rows: 5, cols: 5 },
                        words: [
                            { word: 'RACKS', number: 1, direction: 'across', row: 0, col: 0 }, { word: 'IMHIT', number: 6, direction: 'across', row: 1, col: 0 },
                            { word: 'DIALA', number: 7, direction: 'across', row: 2, col: 0 }, { word: 'ERING', number: 8, direction: 'across', row: 3, col: 0 },
                            { word: 'RINSE', number: 9, direction: 'across', row: 4, col: 0 }, { word: 'RIDER', number: 1, direction: 'down', row: 0, col: 0 },
                            { word: 'AMIRI', number: 2, direction: 'down', row: 0, col: 1 }, { word: 'CHAIN', number: 3, direction: 'down', row: 0, col: 2 },
                            { word: 'KILNS', number: 4, direction: 'down', row: 0, col: 3 }, { word: 'STAGE', number: 5, direction: 'down', row: 0, col: 4 }
                        ],
                        clues: { across: [ { number: 1, text: 'Places to park bikes or vinyl' }, { number: 6, text: 'Common war movie line' }, { number: 7, text: '"In my day, you\'d need to _____ number to request a song."' }, { number: 8, text: 'Oura project category?' }, { number: 9, text: 'Before you repeat, sometimes' } ], down: [ { number: 1, text: 'Competitor, or list of requirements' }, { number: 2, text: 'Luxe menswear label in hip-hop/celeb niche' }, { number: 3, text: 'Drive component or fashion accessory' }, { number: 4, text: 'Hot spots' }, { number: 5, text: 'Part of a Tour, or a show' } ] }
                    },
                    {
                        id: 'global-rollout-2025-07-16',
                        title: 'Global Rollout',
                        info: '2025-07-16 • Medium • 5×5',
                        gridSize: { rows: 5, cols: 5 },
                        words: [
                            { word: 'YORKE', number: 1, direction: 'across', row: 0, col: 0 },
                            { word: 'ARENA', number: 6, direction: 'across', row: 1, col: 0 },
                            { word: 'NIGER', number: 7, direction: 'across', row: 2, col: 0 },
                            { word: 'NOEL', number: 8, direction: 'across', row: 3, col: 0 },
                            { word: 'INTL', number: 9, direction: 'across', row: 4, col: 0 },
                            { word: 'YANNI', number: 1, direction: 'down', row: 0, col: 0 },
                            { word: 'ORION', number: 2, direction: 'down', row: 0, col: 1 },
                            { word: 'REGET', number: 3, direction: 'down', row: 0, col: 2 },
                            { word: 'KNELL', number: 4, direction: 'down', row: 0, col: 3 },
                            { word: 'EAR', number: 5, direction: 'down', row: 0, col: 4 }
                        ],
                        clues: {
                            across: [
                                { number: 1, text: 'Ambition makes you look pretty ugly, to him' },
                                { number: 6, text: 'A step above a shed' },
                                { number: 7, text: 'Not to be confused with the Afrobeats mecca' },
                                { number: 8, text: 'Tolerating his brother this summer' },
                                { number: 9, text: 'Abbr. for worldly major label dept' }
                            ],
                            down: [
                                { number: 1, text: 'A lord of the keytar' },
                                { number: 2, text: 'Master of Puppets deep cut' },
                                { number: 3, text: 'Third word in title of Edith Piaf classic, if it were about never obtaining anything again?' },
                                { number: 4, text: 'A solemn bell sound' },
                                { number: 5, text: 'Trust this, along with your other one' }
                            ]
                        }
                    },
                    {
                        id: 'classic-hiphop-2025-07-17',
                        title: 'Classic Hip-Hop and Whatnot',
                        info: '2025-07-17 • Medium • 5×5',
                        gridSize: { rows: 5, cols: 5 },
                        words: [
                            { word: 'FROST', number: 1, direction: 'across', row: 0, col: 0 },
                            { word: 'RAKIM', number: 6, direction: 'across', row: 1, col: 0 },
                            { word: 'ORION', number: 7, direction: 'across', row: 2, col: 0 },
                            { word: 'NEURO', number: 8, direction: 'across', row: 3, col: 0 },
                            { word: 'TOAST', number: 9, direction: 'across', row: 4, col: 0 },
                            { word: 'FRONT', number: 1, direction: 'down', row: 0, col: 0 },
                            { word: 'RADIO', number: 2, direction: 'down', row: 0, col: 1 },
                            { word: 'OKIES', number: 3, direction: 'down', row: 0, col: 2 },
                            { word: 'SINUT', number: 4, direction: 'down', row: 0, col: 3 },
                            { word: 'TMNOT', number: 5, direction: 'down', row: 0, col: 4 }
                        ],
                        clues: {
                            across: [
                                { number: 1, text: 'O\'Shea\'s friend Kid (Renegade)' },
                                { number: 6, text: '1/2 of hip-hop royalty' },
                                { number: 7, text: 'The Hunter' },
                                { number: 8, text: 'Prefix related to the brain' },
                                { number: 9, text: 'Cheers with drinks' }
                            ],
                            down: [
                                { number: 1, text: 'Pose, in hip-hop' },
                                { number: 2, text: 'LL Cool J couldn\'t live without it' },
                                { number: 3, text: 'Steinbeck\'s migrants' },
                                { number: 4, text: 'Body cavity in your head' },
                                { number: 5, text: 'Teenage Mutant Ninja Turtles, initially, when out of order' }
                            ]
                        }
                    }
                ];
                this.init();
            }

            init() {
                // Check if we're on the live Replit URL
                this.isProduction = window.location.hostname.includes('.replit.app') || 
                                    window.location.hostname.includes('.repl.co');

                // Load puzzle from URL parameters
                this.loadPuzzleFromURL();

                // Check subscription status
                if (this.isProduction) {
                    this.checkSubscription();
                }

                this.loadPuzzle();
                this.setupEvents();
            }

            loadPuzzleFromURL() {
                const urlParams = new URLSearchParams(window.location.search);
                const puzzleId = urlParams.get('id');
                const token = urlParams.get('token');

                // Store token for subscription check
                this.userToken = token;

                // Load specific puzzle
                if (puzzleId) {
                    const puzzleIndex = this.puzzles.findIndex(p => p.id === puzzleId);
                    if (puzzleIndex !== -1) {
                        this.currentPuzzleIndex = puzzleIndex;
                    }
                }
            }

            checkSubscription() {
                // For MVP, just check if token exists
                // Later you can validate with Beehiiv API
                if (!this.userToken) {
                    // Show subscription gate after a delay so they see the puzzle briefly
                    setTimeout(() => this.showSubscriptionGate(), 2000);
                    return false;
                }
                return true;
            }

            showSubscriptionGate() {
                const modal = document.createElement('div');
                modal.id = 'subscription-modal';
                modal.innerHTML = `
                    <div style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
                                background: rgba(0,0,0,0.8); display: flex; 
                                align-items: center; justify-content: center; z-index: 1000;">
                        <div style="background: white; padding: 40px; border-radius: 12px; 
                                    max-width: 400px; text-align: center;">
                            <h2 style="color: #1a1a1a; margin-bottom: 20px;">Subscribe to Music Mini</h2>
                            <p style="color: #666; margin-bottom: 30px;">
                                Get daily music crosswords delivered to your inbox
                            </p>
                            <a href="https://your-newsletter.beehiiv.com/subscribe" 
                               style="display: inline-block; background: #1877f2; color: white; 
                                      padding: 12px 30px; border-radius: 6px; text-decoration: none; 
                                      font-weight: 600;">
                                Subscribe Now
                            </a>
                            <p style="margin-top: 20px; font-size: 14px; color: #999;">
                                Already a subscriber? Check your email for the correct link.
                            </p>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            }

            loadPuzzle() {
                const puzzle = this.puzzles[this.currentPuzzleIndex];
                document.documentElement.style.setProperty('--grid-size', puzzle.gridSize.cols);
                document.getElementById('puzzleTitle').textContent = puzzle.title;
                document.getElementById('puzzleInfo').textContent = puzzle.info;
                this.generateGrid(puzzle);
                this.updateClues(puzzle);
                document.getElementById('prevPuzzle').disabled = this.currentPuzzleIndex === 0;
                document.getElementById('nextPuzzle').disabled = this.currentPuzzleIndex === this.puzzles.length - 1;
            }

            // Rest of the methods remain exactly the same as your original
            generateGrid(puzzle) {
                const grid = document.getElementById('crosswordGrid');
                grid.innerHTML = '';
                const gridData = Array(puzzle.gridSize.rows).fill(null).map(() => Array(puzzle.gridSize.cols).fill(null));
                puzzle.words.forEach(wordInfo => {
                    let r = wordInfo.row, c = wordInfo.col;
                    for (let i = 0; i < wordInfo.word.length; i++) {
                        if (!gridData[r][c]) gridData[r][c] = { answer: '', across: null, down: null };
                        gridData[r][c].answer = wordInfo.word[i];
                        gridData[r][c][wordInfo.direction] = wordInfo.number;
                        if (i === 0) gridData[r][c].number = wordInfo.number;
                        if (wordInfo.direction === 'across') c++; else r++;
                    }
                });
                for (let r = 0; r < puzzle.gridSize.rows; r++) {
                    for (let c = 0; c < puzzle.gridSize.cols; c++) {
                        const cellData = gridData[r][c];
                        if (!cellData) {
                            grid.appendChild(document.createElement('div')).className = 'black-cell';
                        } else {
                            const cellWrapper = document.createElement('div');
                            cellWrapper.className = 'grid-cell';
                            const input = document.createElement('input');
                            input.type = 'text'; input.maxLength = 1;
                            input.dataset.row = r; input.dataset.col = c;
                            input.dataset.answer = cellData.answer;
                            if (cellData.across) input.dataset.across = cellData.across;
                            if (cellData.down) input.dataset.down = cellData.down;
                            cellWrapper.appendChild(input);
                            if (cellData.number) {
                                const numberSpan = document.createElement('span');
                                numberSpan.className = 'cell-number';
                                numberSpan.textContent = cellData.number;
                                cellWrapper.appendChild(numberSpan);
                            }
                            grid.appendChild(cellWrapper);
                        }
                    }
                }
                this.loadProgress();
            }

            updateClues(puzzle) {
                 const acrossDiv = document.getElementById('cluesAcross');
                 const downDiv = document.getElementById('cluesDown');
                 acrossDiv.innerHTML = '';
                 downDiv.innerHTML = '';
                 puzzle.clues.across.forEach(clue => {
                     const div = document.createElement('div');
                     div.className = 'clue-item';
                     div.innerHTML = `<b>${clue.number}.</b> ${clue.text}`;
                     acrossDiv.appendChild(div);
                 });
                 puzzle.clues.down.forEach(clue => {
                     const div = document.createElement('div');
                     div.className = 'clue-item';
                     div.innerHTML = `<b>${clue.number}.</b> ${clue.text}`;
                     downDiv.appendChild(div);
                 });
            }

            setupEvents() {
                document.getElementById('prevPuzzle').addEventListener('click', () => this.navigate(-1));
                document.getElementById('nextPuzzle').addEventListener('click', () => this.navigate(1));
                const grid = document.getElementById('crosswordGrid');
                grid.addEventListener('click', (e) => this.handleCellClick(e));
                grid.addEventListener('input', (e) => this.handleInput(e));
                grid.addEventListener('keydown', (e) => this.handleKeydown(e));
                document.getElementById('victory-screen').addEventListener('click', () => {
                    document.getElementById('victory-screen').classList.remove('show');
                });
            }

            navigate(direction) {
                this.currentPuzzleIndex += direction;
                this.loadPuzzle();
            }

            handleCellClick(e) {
                if (e.target.tagName !== 'INPUT') return;
                const input = e.target;
                if (input === this.activeCell && input.dataset.across && input.dataset.down) {
                    this.direction = this.direction === 'across' ? 'down' : 'across';
                } else if (!input.dataset[this.direction]) {
                    this.direction = input.dataset.across ? 'across' : 'down';
                }
                this.activeCell = input;
                this.highlightWord();
            }

            handleInput(e) {
                if (e.target.tagName !== 'INPUT') return;
                const input = e.target;
                input.value = input.value.toUpperCase();
                this.saveProgress();
                if (input.value) this.moveArrow(input, this.direction === 'across' ? 0 : 1, this.direction === 'across' ? 1 : 0);
                this.checkCompletion();
            }

            handleKeydown(e) {
                if (!this.activeCell) return;
                let dr = 0, dc = 0;
                switch (e.key) {
                    case 'ArrowUp': dr = -1; this.direction = 'down'; break;
                    case 'ArrowDown': dr = 1; this.direction = 'down'; break;
                    case 'ArrowLeft': dc = -1; this.direction = 'across'; break;
                    case 'ArrowRight': dc = 1; this.direction = 'across'; break;
                    case 'Backspace':
                        if (!this.activeCell.value) {
                             e.preventDefault();
                             this.moveArrow(this.activeCell, this.direction === 'across' ? 0 : -1, this.direction === 'across' ? -1 : 0);
                        }
                        return;
                    default: return;
                }
                e.preventDefault();
                this.moveArrow(this.activeCell, dr, dc);
            }

            moveArrow(cell, dr, dc) {
                const r = parseInt(cell.dataset.row) + dr;
                const c = parseInt(cell.dataset.col) + dc;
                const nextCell = document.querySelector(`input[data-row='${r}'][data-col='${c}']`);
                if (nextCell) {
                     this.activeCell = nextCell;
                     this.activeCell.focus();
                     this.highlightWord();
                }
            }

            highlightWord() {
                document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('highlight-word', 'highlight-active'));
                if (!this.activeCell) return;
                this.activeCell.select();
                const clueNum = this.activeCell.dataset[this.direction];
                if (!clueNum) return;
                document.querySelectorAll(`input[data-${this.direction}='${clueNum}']`).forEach(cell => {
                    cell.parentElement.classList.add('highlight-word');
                });
                this.activeCell.parentElement.classList.add('highlight-active');
                this.updateStickyClue(clueNum);
            }

            updateStickyClue(clueNum) {
                const puzzle = this.puzzles[this.currentPuzzleIndex];
                const clueData = puzzle.clues[this.direction].find(c => c.number == clueNum);
                const clueBar = document.getElementById('sticky-clue-bar');
                clueBar.querySelector('.clue-number').textContent = `${clueData.number}.`;
                clueBar.querySelector('.clue-text').textContent = clueData.text;
            }

            loadProgress() { /* Placeholder */ }
            saveProgress() { /* Placeholder */ }

            checkCompletion() {
                const inputs = document.querySelectorAll('.grid-cell input');
                for (const input of inputs) {
                    if (input.value.toUpperCase() !== input.dataset.answer) return;
                }
                this.showVictoryScreen();
            }

            showVictoryScreen() {
                const puzzle = this.puzzles[this.currentPuzzleIndex];
                const screen = document.getElementById('victory-screen');
                const iconContainer = document.getElementById('victory-icon-container');
                const gifContainer = document.getElementById('victory-gif-container');

                // Set the victory message, defaulting to "You did it!"
                document.getElementById('victory-message-text').textContent = puzzle.winMessage || "You did it!";

                if (puzzle.victoryGif) {
                    iconContainer.style.display = 'none';
                    gifContainer.innerHTML = `<img src="${puzzle.victoryGif}" class="victory-gif" alt="Victory animation">`;
                    gifContainer.style.display = 'block';
                } else {
                    gifContainer.style.display = 'none';
                    iconContainer.style.display = 'block';
                }
                screen.classList.add('show');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new SimpleCrossword();
        });
    </script>
</body>
</html>
