<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Mini Crossword</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ===== Music Mini Styling (Issue 1 aesthetic) ===== */
    :root {
      --ink:#111; --ink-2:#333; --ink-3:#555; --paper:#fff;
      --rule-strong:3px; --rule-fine:1px; --gap:2px;
    }

    html,body { background:var(--paper); margin:0; padding:0; }
    body {
      font-family:"Courier New", Courier, ui-monospace, monospace;
      color:var(--ink);
      margin:24px;
      display:flex;
      justify-content:center;
    }

    #app { max-width:520px; width:100%; }

    /* Header */
    .mm-header { text-align:center; margin:0 auto 16px auto; }
    .mm-title { font-size:34px; letter-spacing:1px; margin:6px 0 2px 0; }
    .mm-subtitle { font-size:18px; font-weight:700; margin:2px 0 6px 0; }
    .mm-meta { font-size:12px; color:var(--ink-3); margin-bottom:12px; }
    .mm-instruction { font-size:14px; font-weight:700; margin:8px 0 10px 0; }
    .mm-rule { border:0; border-top:var(--rule-fine) solid var(--ink); margin:8px 0 16px 0; }

    /* Grid */
    #gridAndClues { display:grid; gap:20px; grid-template-columns:1fr; }
    @media (min-width: 900px) {
      #gridAndClues { grid-template-columns:auto 1fr; align-items:start; }
    }

    #crosswordGrid {
      display:grid;
      gap:var(--gap);
      background:#ddd;
      padding:var(--gap);
      border:var(--rule-fine) solid var(--ink);
      margin:0 auto 8px auto;
    }

    .grid-cell {
      position:relative;
      background:#fff;
      display:grid;
      place-items:center;
      width:100%;
      aspect-ratio:1/1;
      border:var(--rule-fine) solid transparent;
    }

    .grid-cell input {
      width:100%;
      height:100%;
      text-align:center;
      border:0;
      outline:0;
      font-family:"Courier New", Courier, ui-monospace, monospace;
      font-size:22px;
      text-transform:uppercase;
      color:var(--ink);
    }

    .black-cell { background:var(--ink); width:100%; aspect-ratio:1/1; }

    .cell-number {
      position:absolute;
      top:3px;
      left:4px;
      font-size:10px;
      color:#666;
    }

    .highlight-word { outline:2px solid var(--ink); }
    .highlight-active { outline:2px solid #1a1ae8; }

    /* Clues */
    #clues h2 {
      font-size:18px;
      margin:18px 0 8px 0;
      border-top:var(--rule-strong) solid var(--ink);
      padding-top:8px;
    }

    #clues h2 + div {
      border-top:var(--rule-fine) solid var(--ink);
      padding-top:8px;
      margin-top:8px;
    }

    .clue-item {
      font-size:14px;
      line-height:1.5;
      color:var(--ink-2);
      margin:10px 0;
      white-space:normal;
    }

    .clue-item b {
      font-weight:700;
      color:var(--ink);
      margin-right:6px;
      display:inline-block;
      min-width:22px;
    }

    @media (max-width: 420px){
      #crosswordGrid{ margin-left:auto; margin-right:auto; }
      .grid-cell input{ font-size:20px; }
    }

  </style>
</head>
<body>
  <div id="app">
    <header class="mm-header">
      <h1 class="mm-title">Music Mini</h1>
      <div class="mm-subtitle">World Premiere</div>
      <div class="mm-meta" id="puzzleInfo">09–26–2025 • 5×5</div>
      <div class="mm-instruction">Select a square to start</div>
      <hr class="mm-rule" />
    </header>

    <main id="gridAndClues">
      <div id="crosswordGrid" aria-label="Crossword grid"></div>
      <aside id="clues">
        <h2>Across</h2>
        <div id="cluesAcross"></div>
        <h2 style="margin-top:16px;">Down</h2>
        <div id="cluesDown"></div>
      </aside>
    </main>
  </div>

  <script>
    class SimpleCrossword {
      constructor() {
        this.puzzleIds = [
          'coachella-vibes-2025-10-03',
          'global-rollout-2025-07-16',
          'cycling-playlist-2025-07-19'
        ];
        this.currentPuzzleIndex = 0;
        this.currentPuzzleData = null;
        this.direction = 'across';
        this.activeCell = null;
        this.startTime = null;
        this.elapsedTime = 0;
        this.timerInterval = null;
        this.init();
      }

      async init() {
        const puzzleIdFromUrl = this.getPuzzleIdFromUrl();
        const idx = this.puzzleIds.indexOf(puzzleIdFromUrl);
        this.currentPuzzleIndex = idx !== -1 ? idx : 0;
        await this.loadPuzzleById(this.puzzleIds[this.currentPuzzleIndex]);
        this.setupEvents();
      }

      getPuzzleIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('puzzle');
      }

      async loadPuzzleById(puzzleId) {
        const res = await fetch(`/puzzles/${puzzleId}.json`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Failed to load puzzle ${puzzleId}`);
        this.currentPuzzleData = await res.json();
        this.renderPuzzle();
      }

      renderPuzzle() {
        const p = this.currentPuzzleData;
        document.querySelector('.mm-meta').textContent = p.info;
        this.generateGrid(p);
        this.updateClues(p);
      }

      generateGrid(puzzle) {
        const grid = document.getElementById('crosswordGrid');
        grid.innerHTML = '';
        const { rows, cols } = puzzle.gridSize;
        const isDesktop = window.matchMedia('(min-width: 768px)').matches;
        const cellSize = isDesktop ? 55 : 18;
        const unit = isDesktop ? 'px' : 'vw';
        grid.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}${unit})`;
        grid.style.gridTemplateRows = `repeat(${rows}, ${cellSize}${unit})`;
        grid.style.width = `${cols * cellSize}${unit}`;

        const gridData = Array.from({ length: rows }, () => Array(cols).fill(null));
        puzzle.words.forEach(w => {
          let r = w.row, c = w.col;
          for (let i = 0; i < w.word.length; i++) {
            if (!gridData[r][c]) gridData[r][c] = {answer:'', across:null, down:null};
            gridData[r][c].answer = w.word[i];
            gridData[r][c][w.direction] = w.number;
            if (i===0) gridData[r][c].number = w.number;
            if (w.direction==='across') c++; else r++;
          }
        });

        for (let r=0;r<rows;r++){
          for (let c=0;c<cols;c++){
            const cell = gridData[r][c];
            if (!cell){
              const div=document.createElement('div');
              div.className='black-cell';
              grid.appendChild(div);
            } else {
              const wrap=document.createElement('div');
              wrap.className='grid-cell';
              const input=document.createElement('input');
              input.type='text';
              input.maxLength=1;
              input.dataset.row=r;
              input.dataset.col=c;
              input.dataset.answer=cell.answer;
              if (cell.across) input.dataset.across=cell.across;
              if (cell.down) input.dataset.down=cell.down;
              wrap.appendChild(input);
              if (cell.number){
                const num=document.createElement('span');
                num.className='cell-number';
                num.textContent=cell.number;
                wrap.appendChild(num);
              }
              grid.appendChild(wrap);
            }
          }
        }
      }

      updateClues(puzzle){
        const across=document.getElementById('cluesAcross');
        const down=document.getElementById('cluesDown');
        across.innerHTML=''; down.innerHTML='';
        puzzle.clues.across.forEach(c=>{
          const div=document.createElement('div');
          div.className='clue-item';
          div.innerHTML=`<b>${c.number}.</b> ${c.text}`;
          across.appendChild(div);
        });
        puzzle.clues.down.forEach(c=>{
          const div=document.createElement('div');
          div.className='clue-item';
          div.innerHTML=`<b>${c.number}.</b> ${c.text}`;
          down.appendChild(div);
        });
      }

      setupEvents(){
        const grid=document.getElementById('crosswordGrid');
        grid.addEventListener('click',e=>this.handleCellClick(e));
        grid.addEventListener('input',e=>this.handleInput(e));
        grid.addEventListener('keydown',e=>this.handleKeydown(e));
      }

      handleCellClick(e){
        if (e.target.tagName!=='INPUT') return;
        const input=e.target;
        if (input===this.activeCell && input.dataset.across && input.dataset.down){
          this.direction=this.direction==='across'?'down':'across';
        } else if (!input.dataset[this.direction]){
          this.direction=input.dataset.across?'across':'down';
        }
        this.activeCell=input;
        this.highlightWord();
      }

      handleInput(e){
        if (e.target.tagName!=='INPUT') return;
        const input=e.target;
        input.value=input.value.toUpperCase();
        if (input.value) this.moveArrow(input,this.direction==='across'?0:1,this.direction==='across'?1:0);
        this.checkCompletion();
      }

      handleKeydown(e){
        if (!this.activeCell) return;
        let dr=0,dc=0;
        switch(e.key){
          case 'ArrowUp':dr=-1;this.direction='down';break;
          case 'ArrowDown':dr=1;this.direction='down';break;
          case 'ArrowLeft':dc=-1;this.direction='across';break;
          case 'ArrowRight':dc=1;this.direction='across';break;
          case 'Backspace':
            if (!this.activeCell.value){
              e.preventDefault();
              this.moveArrow(this.activeCell,this.direction==='across'?0:-1,this.direction==='across'?-1:0);
            } return;
          default:return;
        }
        e.preventDefault();
        this.moveArrow(this.activeCell,dr,dc);
      }

      moveArrow(cell,dr,dc){
        const r=parseInt(cell.dataset.row)+dr;
        const c=parseInt(cell.dataset.col)+dc;
        const next=document.querySelector(`input[data-row='${r}'][data-col='${c}']`);
        if (next){this.activeCell=next;next.focus();this.highlightWord();}
      }

      highlightWord(){
        document.querySelectorAll('.grid-cell').forEach(c=>c.classList.remove('highlight-word','highlight-active'));
        if (!this.activeCell) return;
        this.activeCell.select();
        const clueNum=this.activeCell.dataset[this.direction];
        if (!clueNum) return;
        document.querySelectorAll(`input[data-${this.direction}='${clueNum}']`).forEach(cell=>{
          cell.parentElement.classList.add('highlight-word');
        });
        this.activeCell.parentElement.classList.add('highlight-active');
      }

      checkCompletion(){
        const inputs=document.querySelectorAll('.grid-cell input');
        for(const input of inputs){
          if(input.value.toUpperCase()!==input.dataset.answer)return;
        }
        alert("🎉 You solved it!");
      }
    }

    document.addEventListener('DOMContentLoaded',()=>new SimpleCrossword());
  </script>
</body>
</html>
